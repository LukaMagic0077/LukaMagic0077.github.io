<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#7c3aed" />
<meta name="description" content="AI 词汇打卡营：每天 10 分钟，14 天掌握 93 个 AI 生态核心英文词汇" />
<title>AI 词汇打卡营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8fafc 0%,#f5f3ff 100%);background-attachment:fixed;color:#0f172a;min-height:100vh}
button{font-family:inherit;border:none;cursor:pointer;background:none}
.wrap{max-width:640px;margin:0 auto}
/* ── 顶部栏 ── */
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,214,254,.6)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.hd-l{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(124,58,237,.25)}
.hd h1{font-size:16px;font-weight:700;line-height:1.25}
.hd .sub{font-size:11px;color:#94a3b8}
.hd-r{display:flex;gap:16px;text-align:center}
.hd-r .num{font-size:14px;font-weight:700}
.hd-r .num.orange{color:#f97316}
.hd-r .num.violet{color:#7c3aed}
.hd-r .num .of{font-size:11px;color:#94a3b8;font-weight:400}
.hd-r .lbl{font-size:10px;color:#94a3b8}
.pbar{height:4px;background:rgba(221,214,254,.6)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#6366f1);transition:width .5s;width:0}
/* ── 标签导航 ── */
nav.tabs{display:flex;gap:8px;padding:16px 14px 0}
nav.tabs button{flex:1;white-space:nowrap;border-radius:999px;padding:11px 4px;font-size:13px;font-weight:500;color:#64748b;background:#fff;transition:all .15s;box-shadow:0 1px 2px rgba(15,23,42,.05)}
nav.tabs button.on{background:#7c3aed;color:#fff;box-shadow:0 4px 10px rgba(124,58,237,.3)}
/* ── 主体 ── */
main{padding:20px 14px calc(96px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid #ede9fe;border-radius:24px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.center{text-align:center;padding:40px 24px}
.big-emoji{font-size:48px}
h2.done-t{font-size:22px;font-weight:700;margin-top:16px}
.dim{color:#64748b;font-size:14px;margin-top:8px;line-height:1.7}
.btn-primary{display:inline-block;margin-top:24px;border-radius:999px;background:#7c3aed;color:#fff;font-size:14px;font-weight:500;padding:11px 26px;box-shadow:0 4px 10px rgba(124,58,237,.3)}
/* ── 学习页 ── */
.learn-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:8px}
.learn-hd .day-k{font-size:12px;font-weight:600;color:#8b5cf6}
.learn-hd .day-f{font-size:17px;font-weight:700;margin-top:2px}
.pill-cnt{flex-shrink:0;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;color:#64748b;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.flash{position:relative;height:24rem;perspective:1200px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;padding:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 25px rgba(139,92,246,.15)}
.face.front{background:linear-gradient(135deg,#f5f3ff,#ffffff 55%,#eef2ff);border:1px solid #ede9fe}
.face.back{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#9333ea);color:#fff;transform:rotateY(180deg);border:1px solid #c7d2fe}
.cat-pill{background:#ede9fe;color:#7c3aed;font-size:12px;font-weight:500;border-radius:999px;padding:5px 12px;margin-bottom:16px}
.term{font-size:30px;font-weight:800;letter-spacing:-.5px;text-align:center;line-height:1.3}
.full{margin-top:12px;font-size:14px;color:#64748b;text-align:center}
.flip-hint{margin-top:32px;font-size:12px;color:#94a3b8}
.back .cn{font-size:20px;font-weight:600;text-align:center;line-height:1.5}
.ex-box{margin-top:22px;width:100%;background:rgba(255,255,255,.12);border-radius:16px;padding:16px}
.ex-box .ex{font-size:14px;line-height:1.65;color:#eef2ff}
.ex-box .ex-cn{font-size:12px;line-height:1.6;color:#c7d2fe;margin-top:8px}
.back .flip-hint{color:#c7d2fe}
.mark-row{display:flex;gap:12px;margin-top:20px}
.mark-row button{flex:1;border-radius:999px;padding:14px;font-size:15px;font-weight:600;transition:opacity .15s}
.mark-row button:active{opacity:.8}
.btn-weak{background:#fef3c7;border:1px solid #fcd34d;color:#d97706}
.btn-known{background:linear-gradient(90deg,#7c3aed,#4f46e5);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.tip{margin-top:12px;text-align:center;font-size:12px;color:#94a3b8}
/* 完成面板 */
.stat-row{display:flex;justify-content:center;gap:40px;margin-top:20px}
.stat-row .v{font-size:26px;font-weight:800}
.stat-row .v.violet{color:#7c3aed}
.stat-row .v.amber{color:#f59e0b}
.stat-row .k{font-size:12px;color:#94a3b8;margin-top:2px}
.btn-checkin{width:100%;margin-top:24px;border-radius:16px;background:linear-gradient(90deg,#f97316,#f59e0b);color:#fff;font-size:16px;font-weight:700;padding:16px;box-shadow:0 8px 20px rgba(249,115,22,.3)}
.btn-checkin:active{opacity:.9}
.checked{margin-top:24px;border-radius:16px;background:#ecfdf5;color:#059669;font-size:14px;font-weight:600;padding:14px}
.again{margin-top:14px;font-size:13px;color:#94a3b8;text-decoration:underline}
/* ── 计划页 ── */
.note{background:#fff;border:1px solid #ede9fe;border-radius:16px;padding:14px 16px;font-size:13px;color:#64748b;line-height:1.7;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.note b{color:#1e293b}
.day-grid{display:grid;gap:12px}
.day-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #f1f5f9;border-radius:16px;padding:16px;text-align:left;width:100%;transition:all .15s}
.day-card:active{transform:scale(.985)}
.day-card .badge{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:#f1f5f9;color:#94a3b8}
.day-card.done{background:rgba(236,253,245,.6);border-color:#a7f3d0}
.day-card.done .badge{background:#10b981;color:#fff}
.day-card.active{border-color:#c4b5fd;box-shadow:0 4px 12px rgba(139,92,246,.15)}
.day-card.active .badge{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}
.day-card .tt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-card .mm{font-size:12px;color:#94a3b8;margin-top:3px}
.day-card .tag-done{color:#059669;margin-left:8px}
.day-card .tag-now{color:#7c3aed;margin-left:8px}
/* ── 词库页 ── */
.search{width:100%;border:1px solid #ede9fe;border-radius:16px;background:#fff;padding:14px 16px;font-size:14px;outline:none;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.search:focus{border-color:#a78bfa}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cats button{border-radius:999px;padding:7px 13px;font-size:12px;font-weight:500;background:#fff;color:#64748b;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.cats button.on{background:#7c3aed;color:#fff}
.lib-cnt{font-size:12px;color:#94a3b8;margin-top:12px}
.word-list{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.wcard{background:#fff;border:1px solid #f1f5f9;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.wcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wcard .t{font-weight:700;font-size:15px}
.wcard .f{font-size:11px;color:#94a3b8;font-weight:400;margin-left:8px}
.wcard .c{color:#7c3aed;font-size:14px;margin-top:3px}
.wcard .tags{flex-shrink:0;display:flex;gap:6px}
.tag{border-radius:999px;font-size:10px;padding:3px 8px}
.tag.known{background:#ecfdf5;color:#059669}
.tag.day{background:#f8fafc;color:#94a3b8}
.wcard .exb{margin-top:10px;background:#f8fafc;border-radius:12px;padding:12px}
.wcard .exb .e1{font-size:12px;line-height:1.7;color:#475569}
.wcard .exb .e2{font-size:12px;line-height:1.7;color:#94a3b8;margin-top:4px}
footer{text-align:center;font-size:11px;color:#c4b5fd;padding:0 0 24px}
@media (min-width:640px){
  .flash{height:20rem}
  .day-grid{grid-template-columns:1fr 1fr}
  .term{font-size:36px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="hd-l">
      <span class="logo">✦</span>
      <div>
        <h1>AI 词汇打卡营</h1>
        <p class="sub">每天 10 分钟 · 14 天通关 93 词</p>
      </div>
    </div>
    <div class="hd-r">
      <div><p class="num orange">🔥 <span id="streakNum">0</span></p><p class="lbl">连续打卡</p></div>
      <div><p class="num violet"><span id="knownNum">0</span><span class="of">/93</span></p><p class="lbl">已掌握</p></div>
    </div>
  </div>
  <div class="pbar"><i id="pbarFill"></i></div>
</header>

<nav class="tabs wrap">
  <button data-tab="learn" class="on" onclick="setTab('learn')">📖 今日学习</button>
  <button data-tab="plan" onclick="setTab('plan')">🗓️ 学习计划</button>
  <button data-tab="library" onclick="setTab('library')">🔤 全部词库</button>
</nav>

<main class="wrap" id="main"></main>
<footer>AI 词汇打卡营 · 每天进步一点点</footer>

  { id: 'llm', term: 'LLM', full: 'Large Language Model', cn: '大语言模型', example: 'An LLM like GPT or Claude predicts the next token to generate fluent text.', exampleCn: '像 GPT 或 Claude 这样的大语言模型通过预测下一个词元来生成流畅文本。', category: '基础概念', day: 2 },

  // ── Day 4 · 模型架构 II ───────────────────────────

var TOTAL_DAYS = PLAN.length;
var TOTAL_WORDS = VOCAB.length;

/* ── 状态 ── */
function loadJSON(key, fallback) {
  try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
var known = loadJSON('avc_known', []);
var checkins = loadJSON('avc_checkins', []);
var completedDays = loadJSON('avc_completed', []);

var tab = 'learn';
var activeDay = null;
var index = 0;
var flipped = false;
var finished = false;
var sessionKnown = [];
var sessionWeak = [];
var query = '';
var catFilter = '全部';

function save() {
  try {
    localStorage.setItem('avc_known', JSON.stringify(known));
    localStorage.setItem('avc_checkins', JSON.stringify(checkins));
    localStorage.setItem('avc_completed', JSON.stringify(completedDays));
  } catch (e) {}
}
function dateStr(d) {
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  var day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}
function calcStreak(dates) {
  var set = {};
  for (var i = 0; i < dates.length; i++) set[dates[i]] = 1;
  var d = new Date();
  if (!set[dateStr(d)]) d.setDate(d.getDate() - 1);
  var streak = 0;
  while (set[dateStr(d)]) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function wordsOfDay(d) {
  return VOCAB.filter(function (w) { return w.day === d; });
}
function currentDay() {
  for (var d = 1; d <= TOTAL_DAYS; d++) if (completedDays.indexOf(d) < 0) return d;
  return TOTAL_DAYS;
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── 行为 ── */
function setTab(t) {
  tab = t;
  var btns = document.querySelectorAll('nav.tabs button');
  for (var i = 0; i < btns.length; i++) btns[i].className = btns[i].getAttribute('data-tab') === t ? 'on' : '';
  render();
}
function startSession(d) {
  activeDay = d; index = 0; flipped = false; finished = false;
  sessionKnown = []; sessionWeak = [];
  setTab('learn');
  window.scrollTo(0, 0);
}
function flipCard() {
  flipped = !flipped;
  var f = document.getElementById('flashcard');
  if (f) f.className = flipped ? 'flash flip' : 'flash';
}
function mark(kind) {
  var words = wordsOfDay(activeDay !== null ? activeDay : currentDay());
  var w = words[index];
  if (!w) return;
  if (kind === 'known') {
    if (sessionKnown.indexOf(w.id) < 0) sessionKnown.push(w.id);
    if (known.indexOf(w.id) < 0) known.push(w.id);
  } else {
    if (sessionWeak.indexOf(w.id) < 0) sessionWeak.push(w.id);
    var ki = known.indexOf(w.id);
    if (ki >= 0) known.splice(ki, 1);
  }
  save();
  flipped = false;
  if (index + 1 >= words.length) finished = true; else index++;
  render();
}
function checkIn() {
  var today = dateStr(new Date());
  var day = activeDay !== null ? activeDay : currentDay();
  if (checkins.indexOf(today) < 0) checkins.push(today);
  if (completedDays.indexOf(day) < 0) completedDays.push(day);
  save();
  reportProgress(day);
  render();
}
function reportProgress(doneDay) {
  var text = 'VOCAB_CHECKIN 打卡同步 | day=' + doneDay + ' | known=' + known.length +
    ' | streak=' + calcStreak(checkins) + ' | checkins=' + checkins.length;
  var body = JSON.stringify({ msg_type: 'text', content: { text: text } });
  try {
    var ok = navigator.sendBeacon(WEBHOOK_URL, new Blob([body], { type: 'application/json' }));
    if (!ok) fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', body: body });
  } catch (e) { /* 上报失败不影响本地打卡 */ }
}
function setQuery(v) {
  query = v;
  var wrap = document.getElementById('wordListWrap');
  if (wrap) wrap.innerHTML = libraryList();
}
function setCat(c) { catFilter = c; render(); }

/* ── 渲染 ── */
function renderHeader() {
  document.getElementById('streakNum').textContent = calcStreak(checkins);
  document.getElementById('knownNum').textContent = known.length;
  document.getElementById('pbarFill').style.width = (completedDays.length / TOTAL_DAYS * 100) + '%';
}
function render() {
  renderHeader();
  var m = document.getElementById('main');
  if (tab === 'learn') m.innerHTML = viewLearn();
  else if (tab === 'plan') m.innerHTML = viewPlan();
  else m.innerHTML = viewLibrary();
}
function viewLearn() {
  var allDone = completedDays.length >= TOTAL_DAYS;
  var day = activeDay !== null ? activeDay : currentDay();
  var pd = PLAN[day - 1];
  var words = wordsOfDay(day);

  if (allDone && activeDay === null) {
    return '<div class="card center"><p class="big-emoji">🏆</p>' +
      '<h2 class="done-t">14 天计划全部完成！</h2>' +
      '<p class="dim">你已掌握 ' + known.length + ' / ' + TOTAL_WORDS + ' 个核心词汇，累计打卡 ' + checkins.length + ' 天。<br>可以去「学习计划」复习任何一天，或在「全部词库」里查漏补缺。</p>' +
      '<button class="btn-primary" onclick="setTab(\'plan\')">去复习 →</button></div>';
  }

  if (!finished) {
    var w = words[index];
    if (!w) return '';
    return '<div class="learn-hd"><div>' +
      '<p class="day-k">Day ' + day + ' · ' + esc(pd.title) + '</p>' +
      '<h2 class="day-f">' + esc(pd.focus) + '</h2></div>' +
      '<span class="pill-cnt">' + (index + 1) + ' / ' + words.length + ' · 约 ' + pd.minutes + ' 分钟</span></div>' +

      '<div class="flash' + (flipped ? ' flip' : '') + '" id="flashcard" onclick="flipCard()" role="button" aria-label="点击翻面">' +
      '<div class="flash-inner">' +
      '<div class="face front"><span class="cat-pill">' + esc(w.category) + '</span>' +
      '<h2 class="term">' + esc(w.term) + '</h2>' +
      (w.full ? '<p class="full">' + esc(w.full) + '</p>' : '') +
      '<p class="flip-hint">点击卡片查看释义与例句 →</p></div>' +
      '<div class="face back"><p class="cn">' + esc(w.cn) + '</p>' +
      '<div class="ex-box"><p class="ex">' + esc(w.example) + '</p>' +
      '<p class="ex-cn">' + esc(w.exampleCn) + '</p></div>' +
      '<p class="flip-hint">再点一次翻回 →</p></div>' +
      '</div></div>' +

      '<div class="mark-row">' +
      '<button class="btn-weak" onclick="event.stopPropagation();mark(\'weak\')">🤔 还不熟</button>' +
      '<button class="btn-known" onclick="event.stopPropagation();mark(\'known\')">✅ 认识了</button></div>' +
      '<p class="tip">点击卡片翻面查看释义和例句，然后诚实标记～</p>';
  }

  var todayChecked = checkins.indexOf(dateStr(new Date())) >= 0;
  var streak = calcStreak(checkins);
  var html = '<div class="card center"><p class="big-emoji">🎉</p>' +
    '<h2 class="done-t">Day ' + day + ' 学习完成！</h2>' +
    '<div class="stat-row">' +
    '<div><p class="v violet">' + sessionKnown.length + '</p><p class="k">✅ 认识了</p></div>' +
    '<div><p class="v amber">' + sessionWeak.length + '</p><p class="k">🤔 需巩固</p></div></div>';
  if (todayChecked) {
    html += '<p class="checked">🔥 今日已打卡 · 连续 ' + streak + ' 天</p>';
  } else {
    html += '<button class="btn-checkin" onclick="checkIn()">🔥 完成今日打卡</button>';
  }
  html += '<br><button class="again" onclick="startSession(' + day + ')">再学一遍本日内容</button></div>';
  return html;
}
function viewPlan() {
  var cd = currentDay();
  var html = '<div class="note">📌 计划说明：共 <b>' + TOTAL_DAYS + ' 天</b>，每天约 <b>10 分钟</b>，按「基础概念 → 模型架构 → 训练 → 推理部署 → Agent 范式 → 工具 → 商业术语」循序渐进。学完当日词卡后点击打卡，保持 streak！</div><div class="day-grid">';
  for (var i = 0; i < PLAN.length; i++) {
    var p = PLAN[i];
    var done = completedDays.indexOf(p.day) >= 0;
    var active = p.day === cd && !done;
    var count = wordsOfDay(p.day).length;
    html += '<button class="day-card' + (done ? ' done' : active ? ' active' : '') + '" onclick="startSession(' + p.day + ')">' +
      '<span class="badge">' + (done ? '✓' : p.day) + '</span>' +
      '<div style="min-width:0"><p class="tt">' + esc(p.title) + ' · ' + esc(p.focus) + '</p>' +
      '<p class="mm">' + count + ' 词 · ~' + p.minutes + ' 分钟' +
      (done ? '<span class="tag-done">已完成</span>' : '') +
      (active ? '<span class="tag-now">今天学这个 →</span>' : '') +
      '</p></div></button>';
  }
  return html + '</div>';
}
function viewLibrary() {
  var cats = ['全部'];
  for (var i = 0; i < VOCAB.length; i++) if (cats.indexOf(VOCAB[i].category) < 0) cats.push(VOCAB[i].category);
  var html = '<input class="search" placeholder="搜索英文 / 中文关键词…" value="' + esc(query) + '" oninput="setQuery(this.value)">' +
    '<div class="cats">';
  for (var j = 0; j < cats.length; j++) {
    html += '<button class="' + (catFilter === cats[j] ? 'on' : '') + '" onclick="setCat(\'' + cats[j] + '\')">' + esc(cats[j]) + '</button>';
  }
  html += '</div><div id="wordListWrap">' + libraryList() + '</div>';
  return html;
}
function libraryList() {
  var q = query.trim().toLowerCase();
  var filtered = VOCAB.filter(function (w) {
    var okCat = catFilter === '全部' || w.category === catFilter;
    var okQ = !q || w.term.toLowerCase().indexOf(q) >= 0 ||
      (w.full || '').toLowerCase().indexOf(q) >= 0 || w.cn.toLowerCase().indexOf(q) >= 0;
    return okCat && okQ;
  });
  var html = '<p class="lib-cnt">共 ' + filtered.length + ' 个词条</p><div class="word-list">';
  for (var i = 0; i < filtered.length; i++) {
    var w = filtered[i];
    var isKnown = known.indexOf(w.id) >= 0;
    html += '<div class="wcard"><div class="top"><div>' +
      '<p class="t">' + esc(w.term) + (w.full ? '<span class="f">' + esc(w.full) + '</span>' : '') + '</p>' +
      '<p class="c">' + esc(w.cn) + '</p></div>' +
      '<div class="tags">' + (isKnown ? '<span class="tag known">已掌握</span>' : '') +
      '<span class="tag day">Day ' + w.day + '</span></div></div>' +
      '<div class="exb"><p class="e1">' + esc(w.example) + '</p><p class="e2">' + esc(w.exampleCn) + '</p></div></div>';
  }
  return html + '</div>';
}
function renderLibrary() { render(); }

render();
</script>
</body>
</html>
